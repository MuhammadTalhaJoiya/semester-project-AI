<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>❤️ Heart Disease Predictor</h1>
            <p class="subtitle">AI-Powered Risk Assessment Tool</p>
        </header>

        <div class="main-content">
            <!-- Prediction Form -->
            <div class="form-container">
                <h2>Patient Information</h2>
                <form id="predictionForm" class="prediction-form">
                    
                    <!-- Row 1: Age and Sex -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age *</label>
                            <input type="number" id="age" name="age" min="1" max="120" required
                                   placeholder="Enter age (years)">
                        </div>
                        <div class="form-group">
                            <label for="sex">Sex *</label>
                            <select id="sex" name="sex" required>
                                <option value="">Select...</option>
                                <option value="0">Female</option>
                                <option value="1">Male</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 2: Chest Pain Type and Resting BP -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cp">Chest Pain Type *</label>
                            <select id="cp" name="cp" required>
                                <option value="">Select...</option>
                                <option value="0">Typical Angina</option>
                                <option value="1">Atypical Angina</option>
                                <option value="2">Non-anginal Pain</option>
                                <option value="3">Asymptomatic</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="trestbps">Resting Blood Pressure (mm Hg) *</label>
                            <input type="number" id="trestbps" name="trestbps" min="80" max="250" required
                                   placeholder="e.g., 120">
                        </div>
                    </div>

                    <!-- Row 3: Cholesterol and Fasting Blood Sugar -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="chol">Serum Cholesterol (mg/dl) *</label>
                            <input type="number" id="chol" name="chol" min="100" max="600" required
                                   placeholder="e.g., 200">
                        </div>
                        <div class="form-group">
                            <label for="fbs">Fasting Blood Sugar > 120 mg/dl *</label>
                            <select id="fbs" name="fbs" required>
                                <option value="">Select...</option>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 4: Resting ECG and Max Heart Rate -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="restecg">Resting ECG Results *</label>
                            <select id="restecg" name="restecg" required>
                                <option value="">Select...</option>
                                <option value="0">Normal</option>
                                <option value="1">ST-T Wave Abnormality</option>
                                <option value="2">Left Ventricular Hypertrophy</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="thalach">Max Heart Rate Achieved *</label>
                            <input type="number" id="thalach" name="thalach" min="60" max="220" required
                                   placeholder="e.g., 150">
                        </div>
                    </div>

                    <!-- Row 5: Exercise Angina and ST Depression -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exang">Exercise Induced Angina *</label>
                            <select id="exang" name="exang" required>
                                <option value="">Select...</option>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="oldpeak">ST Depression (oldpeak) *</label>
                            <input type="number" id="oldpeak" name="oldpeak" step="0.1" min="0" max="10" required
                                   placeholder="e.g., 1.5">
                        </div>
                    </div>

                    <!-- Row 6: Slope and Number of Vessels -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="slope">Slope of Peak Exercise ST Segment *</label>
                            <select id="slope" name="slope" required>
                                <option value="">Select...</option>
                                <option value="0">Upsloping</option>
                                <option value="1">Flat</option>
                                <option value="2">Downsloping</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ca">Number of Major Vessels (0-3) *</label>
                            <select id="ca" name="ca" required>
                                <option value="">Select...</option>
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 7: Thalassemia -->
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="thal">Thalassemia *</label>
                            <select id="thal" name="thal" required>
                                <option value="">Select...</option>
                                <option value="1">Normal</option>
                                <option value="2">Fixed Defect</option>
                                <option value="3">Reversible Defect</option>
                            </select>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-actions">
                        <button type="submit" id="predictBtn" class="btn btn-primary">
                            <span class="btn-text">Predict Risk</span>
                            <span class="btn-loader" style="display: none;">⏳ Analyzing...</span>
                        </button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>
            </div>

            <!-- Results Container -->
            <div id="resultsContainer" class="results-container" style="display: none;">
                <h2>Prediction Result</h2>
                <div id="resultsContent" class="results-content">
                    <!-- Results will be displayed here -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>⚠️ This tool is for educational/research purposes only. Consult healthcare professionals for medical advice.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
